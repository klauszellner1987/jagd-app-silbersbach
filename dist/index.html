<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GJR Silbersbach</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles (Vite) -->

    <!-- Leaflet CSS (für Karte) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <!-- Manifest für PWA -->
    <link rel="manifest" href="manifest.json">

    <!-- Theme Farbe für Android Toolbar / Statusbar -->
    <meta name="theme-color" content="#2f6f4e">

    <!-- Icons für Android / iOS -->
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
    <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">

    <!-- iOS Safari: App vollbild -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script type="module" crossorigin src="/jagd-app-silbersbach/assets/index-CJw4l7Vz.js"></script>
  <link rel="stylesheet" crossorigin href="/jagd-app-silbersbach/assets/index-C7Y8EvF9.css">
</head>
<div id="toast-container"></div>
<div class="fab-add" id="fab-add-btn">+</div>

<body>
    <!-- LOGIN OVERLAY (iPhone Lockscreen) -->
    <div id="login-overlay">
        <div class="login-box">
            <!-- Uhrzeit & Datum -->
            <div id="clock">
                <div id="time">--:--</div>
                <div id="date">-- -- ----</div>
            </div>

            <h2>Gib deinen PIN ein</h2>

            <!-- Unsichtbares Input für Tastatur -->
            <input type="password" id="pin-input" autocomplete="off"
                style="opacity:0; position:absolute; pointer-events:none;">

            <!-- PIN Dots -->
            <div id="pin-display">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <!-- PIN Buttons -->
            <div class="pin-buttons">
                <button class="pin-btn">1</button>
                <button class="pin-btn">2</button>
                <button class="pin-btn">3</button>
                <button class="pin-btn">4</button>
                <button class="pin-btn">5</button>
                <button class="pin-btn">6</button>
                <button class="pin-btn">7</button>
                <button class="pin-btn">8</button>
                <button class="pin-btn">9</button>
                <button class="pin-btn delete">⌫</button>
                <button class="pin-btn">0</button>
                <button class="pin-btn ok">OK</button>
            </div>

            <p id="pin-error" class="hidden">Falsche PIN, versuche es erneut.</p>
        </div>
    </div>

    <header class="app-header">
        <h1>GJR Silbersbach</h1>
    </header>

    <div id="hochsitz-modal">
        <h3>Hochsitz Name</h3>
        <input type="text" id="hochsitz-name-input" placeholder="Name eingeben..." />
        <div class="hoch-buttons">
            <button id="hochsitz-save-btn">Speichern</button>
            <button id="hochsitz-cancel-btn">Abbrechen</button>
        </div>
    </div>


    <main class="pt-2 pb-2">
        <!-- Revier Tab -->
        <div class="tab-content active px-3 sm:px-4" id="revier">
            <div id="map-container" class="flex flex-col gap-2">
                <div id="map" class="rounded-2xl shadow-glass border border-white/15"></div>
            </div>
        </div>

        <!-- Streckenliste Tab -->
        <div class="tab-content px-3 sm:px-4" id="streckenliste-tab">
            <button id="add-entry-btn">+</button>
            <div class="backdrop-blur-md bg-white/10 border border-white/20 rounded-2xl p-5 text-[var(--text)] shadow-glass animate-fade-in">
                <h2 class="mb-3 text-xl font-bold flex items-center gap-2">
                    <span class="text-2xl">📋</span>
                    <span>Streckenliste</span>
                </h2>
                <ul id="entry-list" class="space-y-2"></ul>
            </div>
        </div>

        <!-- Wetter Tab - JETZT AKTIV ALS STANDARD -->
        <div class="tab-content active px-3 sm:px-4" id="wetter-tab">
            <!-- 3-Spalten Grid für Wetter-Widgets (wie Mockup) -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <!-- Temperatur Widget -->
                <div class="weather-widget backdrop-blur-md bg-white/10 border border-white/20 rounded-2xl p-4 text-[var(--text)] shadow-glass hover:bg-white/15 hover:shadow-glass-lg hover:-translate-y-1 transition-all duration-300 animate-fade-in" id="widget-weather">
                    <div class="flex items-center gap-4">
                        <span class="text-6xl">🌡️</span>
                        <div class="flex-1">
                            <p class="text-3xl font-bold">-- °C</p>
                        </div>
                    </div>
                </div>

                <!-- Wind Widget -->
                <div class="wind-widget backdrop-blur-md bg-white/10 border border-white/20 rounded-2xl p-4 text-[var(--text)] shadow-glass hover:bg-white/15 hover:shadow-glass-lg hover:-translate-y-1 transition-all duration-300 animate-fade-in" style="animation-delay: 0.1s" id="widget-wind">
                    <div class="flex items-center gap-4">
                        <span class="text-6xl">💨</span>
                        <div class="flex-1">
                            <p class="text-xl font-bold">--</p>
                            <p class="text-sm opacity-80">-- km/h</p>
                        </div>
                    </div>
                </div>

                <!-- Mond Widget -->
                <div class="moon-widget backdrop-blur-md bg-white/10 border border-white/20 rounded-2xl p-4 text-[var(--text)] shadow-glass hover:bg-white/15 hover:shadow-glass-lg hover:-translate-y-1 transition-all duration-300 animate-fade-in" style="animation-delay: 0.2s" id="widget-moon">
                    <div class="flex items-center gap-4">
                        <span class="text-6xl">🌙</span>
                        <div class="flex-1">
                            <p class="text-base font-bold">--</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </main>

<!-- Navigation Container -->
<div class="nav-container">
    <footer class="floating-nav">
        <!-- KARTEN-ICON: Gefaltete Karte -->
        <button class="tab-button" data-tab="revier">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                <line x1="8" y1="2" x2="8" y2="18"></line>
                <line x1="16" y1="6" x2="16" y2="22"></line>
            </svg>
        </button>
        
        <!-- LISTEN-ICON: Drei Linien mit Kreisen -->
        <button class="tab-button" data-tab="streckenliste-tab">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="4" cy="6" r="1.5" fill="currentColor"></circle>
                <circle cx="4" cy="12" r="1.5" fill="currentColor"></circle>
                <circle cx="4" cy="18" r="1.5" fill="currentColor"></circle>
                <line x1="9" y1="6" x2="20" y2="6"></line>
                <line x1="9" y1="12" x2="20" y2="12"></line>
                <line x1="9" y1="18" x2="20" y2="18"></line>
            </svg>
        </button>
        
        <!-- WETTER-ICON: Wolke mit Sonne -->
        <button class="tab-button active" data-tab="wetter-tab">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
                <circle cx="18" cy="4" r="3"></circle>
                <line x1="18" y1="1" x2="18" y2="1.5"></line>
                <line x1="21" y1="4" x2="20.5" y2="4"></line>
                <line x1="18" y1="7" x2="18" y2="6.5"></line>
                <line x1="15" y1="4" x2="15.5" y2="4"></line>
            </svg>
        </button>
    </footer>
</div>


    <!-- Modal -->
    <div id="entry-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Neuer Eintrag</h2>
            <form id="entry-form">
                <label>Erleger
                    <select name="erleger">
                        <option>Anton</option>
                        <option>Tobias</option>
                        <option>Patrick</option>
                        <option>Klaus</option>
                    </select>
                </label>

                <label>Wildart
                    <select name="wildart" id="wildart">
                        <option value="">Bitte wählen</option>
                        <option value="Rehwild">Rehwild</option>
                        <option value="Rotwild">Rotwild</option>
                        <option value="Dammwild">Dammwild</option>
                        <option value="Schwarzwild">Schwarzwild</option>
                        <option value="Raubwild">Raubwild</option>
                        <option value="Federwild">Federwild</option>
                    </select>
                </label>

                <div id="subcategory-container"></div>

                <label>Datum
                    <input type="date" name="datum">
                </label>

                <label>Bemerkung
                    <textarea name="bemerkung" rows="2"></textarea>
                </label>

                <label>Gewicht (kg)
                    <input type="number" step="0.1" name="gewicht">
                </label>

                <div class="modal-actions">
                    <button type="button" id="cancel-entry">Abbrechen</button>
                    <button type="submit">Speichern</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Reviere Daten -->
    <script src="assets/data/reviere.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <!-- App JS -->
    <script src="js/app.js"></script>
    <!-- Firebase App (Core) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <!-- Firestore -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <!-- Storage -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

    <!-- Hochsitz Listen Panel -->
    <div id="hochsitz-panel" class="hochsitz-panel hidden">
        <div class="panel-header">
            <span>Hochsitze</span>
            <button id="close-hochsitz-panel">✖</button>
        </div>

        <div class="panel-content"></div>
    </div>
</body>

</html>
