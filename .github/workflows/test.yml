name: Tests

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + Unit + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Hinweis: package-lock.json wurde auf Windows erzeugt und verpasst
      # einige Linux-spezifische optionalDependencies (rollup, esbuild,
      # vitest pretty-format etc.). Workaround: npm install statt npm ci.
      # Siehe https://github.com/npm/cli/issues/4828
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Astro check (Lint + TypeScript)
        run: ./node_modules/.bin/astro check
        continue-on-error: true

      # WICHTIG: ./node_modules/.bin/vitest statt npx, weil npx
      # ansonsten manchmal die LATEST-Version aus dem npm-Cache nimmt
      # statt der in package.json gepinnten 3.2.4 (siehe vitest 4.x
      # ESM-Resolving-Bug auf Linux).
      - name: Run unit tests (Vitest)
        run: ./node_modules/.bin/vitest run

      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run E2E tests (Playwright)
        run: ./node_modules/.bin/playwright test
        env:
          CI: 'true'

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright trace artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
