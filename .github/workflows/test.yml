name: Tests

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + Unit + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Hinweis: package-lock.json wurde auf Windows erzeugt und verpasst
      # einige Linux-spezifische optionalDependencies (rollup, esbuild,
      # vitest pretty-format etc.). Workaround: npm install statt npm ci.
      # Siehe https://github.com/npm/cli/issues/4828
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Astro check (Lint + TypeScript)
        run: npx astro check
        continue-on-error: true

      - name: Diagnose environment
        run: |
          echo "=== Node / NPM / OS ==="
          node -v
          npm -v
          uname -a
          echo "=== Vitest binary present? ==="
          ls -la node_modules/.bin/vitest || echo "VITEST BINARY MISSING"
          echo "=== Vitest version ==="
          npx vitest --version || echo "VITEST VERSION CALL FAILED"
          echo "=== package.json scripts ==="
          cat package.json | grep -A 20 '"scripts"'

      - name: Run unit tests (Vitest)
        run: npx vitest run --reporter=verbose 2>&1
        env:
          DEBUG: 'vite-node:*'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (Playwright)
        run: npx playwright test
        env:
          CI: 'true'

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright trace artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
