name: Tests

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + Unit + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Hinweis: package-lock.json auf Windows erzeugt verpasst einige Linux-
      # spezifische optionalDependencies (rollup, esbuild, vitest tinypool etc.)
      # Bekannter npm-Bug: https://github.com/npm/cli/issues/4828
      # Workaround: package-lock.json wegwerfen + sauber neu installieren.
      - name: Clean install (Linux-konform)
        run: |
          rm -f package-lock.json
          rm -rf node_modules
          npm install --no-audit --no-fund

      - name: Astro check (Lint + TypeScript)
        run: ./node_modules/.bin/astro check
        continue-on-error: true

      - name: Run unit tests (Vitest)
        run: ./node_modules/.bin/vitest run

      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run E2E tests (Playwright)
        # Minimal-Smoke: tests/e2e/smoke.spec.js, unter CI nur chromium-desktop + Retries (siehe playwright.config.ts)
        run: ./node_modules/.bin/playwright test
        env:
          CI: 'true'

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright trace artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
