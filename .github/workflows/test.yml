name: Tests

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + Unit + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Hinweis: package-lock.json wurde auf Windows erzeugt und verpasst
      # einige Linux-spezifische optionalDependencies (rollup, esbuild,
      # vitest pretty-format etc.). Workaround: npm install statt npm ci.
      # Siehe https://github.com/npm/cli/issues/4828
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Astro check (Lint + TypeScript)
        run: npx astro check
        continue-on-error: true

      - name: Run unit tests (Vitest)
        id: vitest
        run: |
          set +e
          npx vitest run --reporter=verbose 2>&1 | tee vitest.log
          EXIT=${PIPESTATUS[0]}
          echo "VITEST_EXIT=$EXIT" >> $GITHUB_OUTPUT
          exit 0

      - name: Show last lines of vitest log on failure
        if: steps.vitest.outputs.VITEST_EXIT != '0'
        run: |
          echo "::group::Vitest output (last 200 lines)"
          tail -n 200 vitest.log
          echo "::endgroup::"
          # Letzte 60 Zeilen als annotations -> via API abrufbar
          tail -n 60 vitest.log | while IFS= read -r line; do
            # Vermeide Probleme mit GitHub-Actions-Logging-Tokens
            cleaned=$(echo "$line" | tr -d '\r' | sed 's/::/__/g')
            echo "::error::$cleaned"
          done
          exit ${{ steps.vitest.outputs.VITEST_EXIT }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (Playwright)
        run: npx playwright test
        env:
          CI: 'true'

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright trace artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
