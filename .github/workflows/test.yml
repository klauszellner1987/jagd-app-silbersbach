name: Tests

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + Unit + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Hinweis: package-lock.json wurde auf Windows erzeugt und verpasst
      # einige Linux-spezifische optionalDependencies (rollup, esbuild,
      # vitest pretty-format etc.). Workaround: package-lock.json + node_modules
      # wegwerfen und sauber neu installieren.
      - name: Clean install (Linux-konform)
        run: |
          rm -f package-lock.json
          rm -rf node_modules
          npm install --no-audit --no-fund

      - name: Diagnose installed binaries
        run: |
          echo "=== node / npm ==="
          node -v && npm -v
          echo "=== node_modules/.bin entries (vitest/playwright/astro) ==="
          ls -la node_modules/.bin/ | grep -E 'vitest|playwright|astro' || true
          echo "=== installed test framework versions ==="
          node -p "require('./node_modules/vitest/package.json').version" 2>&1 || echo "vitest not installed"
          node -p "require('./node_modules/@playwright/test/package.json').version" 2>&1 || echo "playwright not installed"

      - name: Astro check (Lint + TypeScript)
        run: ./node_modules/.bin/astro check
        continue-on-error: true

      - name: Run unit tests (Vitest)
        run: ./node_modules/.bin/vitest run

      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run E2E tests (Playwright)
        run: ./node_modules/.bin/playwright test
        env:
          CI: 'true'

      - name: Upload Playwright HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright trace artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
