<!DOCTYPE html>
<html lang="de">

<head>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revier App</title>
    <link rel="stylesheet" href="style/main.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>

<body>
    <!-- LOGIN OVERLAY -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>PIN Eingabe</h2>
            <div id="pin-display">••••</div>
            <div class="pin-buttons">
                <button class="pin-btn">1</button>
                <button class="pin-btn">2</button>
                <button class="pin-btn">3</button>
                <button class="pin-btn">4</button>
                <button class="pin-btn">5</button>
                <button class="pin-btn">6</button>
                <button class="pin-btn">7</button>
                <button class="pin-btn">8</button>
                <button class="pin-btn">9</button>
                <button class="pin-btn delete">⌫</button>
                <button class="pin-btn">0</button>
                <button class="pin-btn ok">OK</button>
            </div>
            <p id="pin-error" class="hidden">Falsche PIN, versuche es erneut.</p>
        </div>
    </div>
    <header>
        <h1>🦌 GJR Silbersbach</h1>
    </header>

    <main>
        <!-- Revier123 Tab -->
        <div class="tab-content active" id="revier">
            <div id="map-container">
                <h2>LIVE REVIERMAP STATUS</h2>
                <div id="map"></div>
            </div>
        </div>

        <!-- Streckenliste Tab -->
        <div class="tab-content" id="streckenliste-tab">
            <button id="add-entry-btn">+</button>
            <div class="card">
                <h2>Streckenliste</h2>
                <ul id="entry-list">
                    <!-- JSON Einträge -->
                </ul>
            </div>
        </div>
    </main>

    <footer>
        <div class="tabs">
            <button class="tab-button active" data-tab="revier">🏞 Revier</button>
            <button class="tab-button" data-tab="streckenliste-tab">🦌 Streckenliste</button>
        </div>
    </footer>

    <!-- MODAL FÜR NEUEN EINTRAG -->
    <div id="entry-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Neuer Eintrag</h2>
            <form id="entry-form">
                <label>
                    Erleger
                    <select name="erleger">
                        <option>Anton</option>
                        <option>Tobias</option>
                        <option>Patrick</option>
                        <option>Klaus</option>
                    </select>
                </label>

                <label>
                    Wildart
                    <select name="wildart" id="wildart">
                        <option value="">Bitte wählen</option>
                        <option value="Rehwild">Rehwild</option>
                        <option value="Rotwild">Rotwild</option>
                        <option value="Dammwild">Dammwild</option>
                        <option value="Schwarzwild">Schwarzwild</option>
                        <option value="Raubwild">Raubwild</option>
                        <option value="Federwild">Federwild</option>
                    </select>
                </label>

                <div id="subcategory-container"></div>

                <label>
                    Datum
                    <input type="date" name="datum">
                </label>

                <label>
                    Bemerkung
                    <textarea name="bemerkung" rows="2"></textarea>
                </label>

                <label>
                    Gewicht (kg)
                    <input type="number" step="0.1" name="gewicht">
                </label>

                <div class="modal-actions">
                    <button type="button" id="cancel-entry">Abbrechen</button>
                    <button type="submit">Speichern</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Reviere Daten -->
    <script src="assets/data/reviere.js"></script>

    <!-- App JS -->
    <script src="js/app.js"></script>

    <!-- LOGIN JS -->
    <script>
        const correctPin = "1234";
        const overlay = document.getElementById('login-overlay');
        const pinInput = document.getElementById('pin-input');
        const loginBtn = document.getElementById('pin-ok');
        const errorMsg = document.getElementById('pin-error');
        const pinClear = document.getElementById('pin-clear');
        const pinButtons = document.querySelectorAll('.pin-btn');

        // PIN Pad Logik
        pinButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                if (pinInput.value.length < 4) pinInput.value += btn.textContent;
            });
        });

        pinClear.addEventListener('click', () => pinInput.value = '');
        loginBtn.addEventListener('click', () => {
            if (pinInput.value === correctPin) {
                overlay.style.display = 'none';
                // Karte initialisieren, falls noch nicht geladen
                if (typeof initializeMap === "function") initializeMap();
            } else {
                errorMsg.classList.remove('hidden');
                pinInput.value = '';
            }
        });

        pinInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });
    </script>
</body>

</html>
